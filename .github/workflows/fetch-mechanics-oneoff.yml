name: One-off - backfill game mechanics

# Temporary, manually-triggered workflow used to backfill the "mechanics"
# field onto every game in games.json via scripts/fetch-mechanics.js.
# Safe to delete once that backfill has run successfully.

on:
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  backfill:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repo
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Fetch mechanics from BGG
        env:
          BGG_TOKEN: ${{ secrets.BGG_TOKEN }}
        run: node scripts/fetch-mechanics.js

      - name: Commit and push if games.json changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          if git diff --quiet -- games.json; then
            echo "No changes to games.json — skipping commit."
          else
            git add games.json
            git commit -m "Backfill mechanics field on all games"
            git push
          fi
