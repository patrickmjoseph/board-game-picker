name: Refresh game data from BoardGameGeek

on:
  schedule:
    # Runs daily at 09:00 UTC (~2am Pacific). Edit the cron expression to change the cadence.
    - cron: '0 9 * * *'
  workflow_dispatch: {} # lets you trigger a refresh manually from the Actions tab

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repo
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Sync collection and fetch latest stats from BGG
        id: refresh
        env:
          BGG_TOKEN: ${{ secrets.BGG_TOKEN }}
        run: node scripts/fetch-games.js

      - name: Commit and push if games.json changed
        env:
          ADDED_COUNT: ${{ steps.refresh.outputs.added_count }}
          REMOVED_COUNT: ${{ steps.refresh.outputs.removed_count }}
          ADDED_NAMES: ${{ steps.refresh.outputs.added_names }}
          REMOVED_NAMES: ${{ steps.refresh.outputs.removed_names }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          if git diff --quiet -- games.json; then
            echo "No changes to games.json — skipping commit."
          else
            git add games.json
            MSG="Refresh game data from BoardGameGeek"
            if [ "${ADDED_COUNT:-0}" != "0" ]; then
              MSG="$MSG

Added ($ADDED_COUNT): $ADDED_NAMES"
            fi
            if [ "${REMOVED_COUNT:-0}" != "0" ]; then
              MSG="$MSG

Removed ($REMOVED_COUNT): $REMOVED_NAMES"
            fi
            git commit -m "$MSG"
            git push
          fi
