<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Board Game Picker</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,wght@0,500;0,600;0,700;1,500&family=Karla:wght@400;500;600;700&display=swap" rel="stylesheet">

  <link rel="stylesheet" href="styles/main.css">

  <script type="module" src="js/main.js"></script>
</head>
<body>

  <!-- ==================== Site header ==================== -->

  <header class="site-header">
    <div class="site-header__inner">
      <h1 class="site-header__title">Board Game Picker</h1>
      <p class="site-header__subtitle">Carrom Board Game Cafe</p>
      <p class="site-header__tagline">Find a game that fits your group!</p>
    </div>
  </header>

  <!-- ==================== Main content ==================== -->

  <main class="page-content">

    <!-- Toolbar: Search / Sort / Filter -->
    <div class="toolbar">
      <button class="toolbar__button toolbar__button--search" id="findGameBtn" aria-expanded="false">
        <span class="toolbar__button-icon">&#128269;</span> Search
      </button>
      <button class="toolbar__button toolbar__button--sort" id="openSortBtn">
        <span class="toolbar__button-icon">&#8645;</span> Sort
      </button>
      <button class="toolbar__button toolbar__button--filter" id="openFilterBtn">
        <span class="toolbar__button-icon">&#9776;</span> Filter <span class="toolbar__filter-count" id="filterCountBadge" hidden>0</span>
      </button>

      <!-- Search bubble (opens beneath the toolbar) -->
      <div class="search-bubble" id="searchBubble" hidden>
        <input class="search-bubble__input" type="text" id="resultsSearchInput" placeholder="Search within these games…" />
        <button class="search-bubble__clear-button" id="clearResultsSearchBtn" aria-label="Clear search" hidden>&times;</button>
      </div>
    </div>

    <!-- Active filter chips + sort chip (rendered by js/components/active-filters.js) -->
    <div class="active-filters" id="activeFiltersRow"></div>

    <div class="results-header">
      <span class="results-header__count" id="resultsCount"></span>
    </div>

    <!-- Results (rendered by js/components/results.js) -->
    <div id="resultsArea">
      <div class="empty-state">
        <h3 class="empty-state__title">Loading Carrom's collection…</h3>
        <p class="empty-state__message">If this message doesn't go away, your browser may have JavaScript disabled.</p>
      </div>
    </div>

    <div class="bgg-attribution">
      <img class="bgg-attribution__logo" src="assets/images/bgg-attribution-logo.jpg" alt="Powered by BGG" />
    </div>
  </main>

  <!-- ==================== Back-to-top button ==================== -->

  <button class="back-to-top-button" id="backToTopBtn" hidden><span class="back-to-top-button__arrow">&uarr;</span><span class="back-to-top-button__label">Top</span></button>

  <!-- ==================== Filter drawer ==================== -->

  <div class="drawer-backdrop" id="filterBackdrop"></div>
  <div class="drawer drawer--filter filter-panel" id="filterDrawer">
    <div class="drawer__header">
      <h2 class="drawer__title">All Filters</h2>
      <button class="drawer__close-button" id="closeFilterBtn" aria-label="Close filters">&times;</button>
    </div>
    <div class="drawer__body">

      <!-- Players -->
      <div class="filter-panel__category" data-category="players">
        <button class="filter-panel__category-toggle" data-target="players">
          <span># of Players</span>
          <span class="filter-panel__category-status"><span class="filter-panel__category-readout" id="playerReadout"></span><span class="filter-panel__category-chevron">&rsaquo;</span></span>
        </button>
        <div class="filter-panel__category-options" id="catPanel-players" hidden>
          <div class="segmented-control segmented-control--wrap" id="playersSegmented">
            <button class="segmented-control__option" data-val="1">1</button>
            <button class="segmented-control__option" data-val="2">2</button>
            <button class="segmented-control__option" data-val="3">3</button>
            <button class="segmented-control__option" data-val="4">4</button>
            <button class="segmented-control__option" data-val="5">5</button>
            <button class="segmented-control__option" data-val="6+">6+</button>
            <span class="segmented-control__row-break" aria-hidden="true"></span>
            <button class="segmented-control__option segmented-control__option--any" data-val="any">Any</button>
          </div>
        </div>
      </div>

      <!-- Complexity -->
      <div class="filter-panel__category" data-category="difficulty">
        <button class="filter-panel__category-toggle" data-target="difficulty">
          <span>Complexity</span>
          <span class="filter-panel__category-status"><span class="filter-panel__category-readout" id="difficultyReadout"></span><span class="filter-panel__category-chevron">&rsaquo;</span></span>
        </button>
        <div class="filter-panel__category-options" id="catPanel-difficulty" hidden>
          <div class="segmented-control segmented-control--wrap" id="difficultySegmented">
            <button class="segmented-control__option" data-val="1">Light <span class="segmented-control__option-subtext">(1-2)</span></button>
            <button class="segmented-control__option" data-val="2">Medium light <span class="segmented-control__option-subtext">(2-2.5)</span></button>
            <button class="segmented-control__option" data-val="3">Medium <span class="segmented-control__option-subtext">(2.5-3)</span></button>
            <button class="segmented-control__option" data-val="4">Medium heavy <span class="segmented-control__option-subtext">(3-3.75)</span></button>
            <button class="segmented-control__option" data-val="5">Heavy <span class="segmented-control__option-subtext">(3.75+)</span></button>
            <span class="segmented-control__row-break" aria-hidden="true"></span>
            <button class="segmented-control__option segmented-control__option--any" data-val="any">Any</button>
          </div>
        </div>
      </div>

      <!-- Length -->
      <div class="filter-panel__category" data-category="length">
        <button class="filter-panel__category-toggle" data-target="length">
          <span>Length</span>
          <span class="filter-panel__category-status"><span class="filter-panel__category-readout" id="lengthReadout"></span><span class="filter-panel__category-chevron">&rsaquo;</span></span>
        </button>
        <div class="filter-panel__category-options" id="catPanel-length" hidden>
          <div class="segmented-control segmented-control--wrap" id="lengthSegmented">
            <button class="segmented-control__option" data-val="quick">&lt;30 min</button>
            <button class="segmented-control__option" data-val="short">30–60 min</button>
            <button class="segmented-control__option" data-val="medium">60–90 min</button>
            <button class="segmented-control__option" data-val="long">90–120 min</button>
            <button class="segmented-control__option" data-val="epic">120+ min</button>
            <span class="segmented-control__row-break" aria-hidden="true"></span>
            <button class="segmented-control__option segmented-control__option--any" data-val="any">Any</button>
          </div>
        </div>
      </div>

      <!-- Play style -->
      <div class="filter-panel__category" data-category="coop">
        <button class="filter-panel__category-toggle" data-target="coop">
          <span>Play Style</span>
          <span class="filter-panel__category-status"><span class="filter-panel__category-readout" id="coopReadout"></span><span class="filter-panel__category-chevron">&rsaquo;</span></span>
        </button>
        <div class="filter-panel__category-options" id="catPanel-coop" hidden>
          <div class="segmented-control segmented-control--wrap" id="coopSegmented">
            <button class="segmented-control__option" data-val="coop" title="Co-op: work together with your group to beat the game or solve the puzzle!">Co-op</button>
            <button class="segmented-control__option" data-val="teams" title="Teams: team up and go head to head with others in your group!">Teams</button>
            <button class="segmented-control__option" data-val="comp" title="Competitive: Compete against your group to come out alone on top!">Competitive</button>
            <span class="segmented-control__row-break" aria-hidden="true"></span>
            <button class="segmented-control__option segmented-control__option--any" data-val="any">Any</button>
          </div>
        </div>
      </div>

    </div>
    <div class="drawer__footer">
      <button class="drawer__clear-button" id="drawerClearBtn">Clear</button>
      <button class="drawer__apply-button" id="drawerApplyBtn">See all games</button>
    </div>
  </div>

  <!-- ==================== Sort drawer ==================== -->

  <div class="drawer-backdrop" id="sortBackdrop"></div>
  <div class="drawer drawer--sort sort-panel" id="sortDrawer">
    <div class="drawer__header">
      <h2 class="drawer__title">Sort By</h2>
      <button class="drawer__close-button" id="closeSortBtn" aria-label="Close sort">&times;</button>
    </div>
    <p class="sort-panel__current-label" id="sortCurrentLabel"></p>
    <div class="drawer__body">
      <div class="sort-panel__option-list" id="sortOptionList">
        <button class="sort-panel__option" data-val="length">Game length</button>
        <button class="sort-panel__option" data-val="complexity">Complexity</button>
        <button class="sort-panel__option" data-val="rank">BoardGameGeek Rank</button>
        <button class="sort-panel__option" data-val="alpha">Alphabetical</button>
      </div>
      <div class="sort-panel__direction-row">
        <span>Direction</span>
        <button class="sort-panel__direction-button" id="sortDirBtn" aria-label="Toggle sort direction" title="Toggle sort direction">&uarr;</button>
      </div>
    </div>
  </div>

</body>
</html>
